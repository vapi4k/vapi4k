version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised or
    # yanked version has time to be caught upstream.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
